<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EEBC4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="100%" stop-color="#0A0F1C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="88" fill="url(#bgGrad)"/>

  <!-- connecting line through nodes -->
  <line x1="108" y1="200" x2="292" y2="200" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

  <!-- 4-point node/spark mark -->
  <path d="M200 90
           C210 150, 250 190, 310 200
           C250 210, 210 250, 200 310
           C190 250, 150 210, 90 200
           C150 190, 190 150, 200 90 Z"
        fill="url(#tealGrad)"/>

  <!-- side nodes representing connected processes -->
  <circle cx="100" cy="200" r="16" fill="url(#tealGrad)"/>
  <circle cx="300" cy="200" r="16" fill="url(#tealGrad)"/>
</svg>
